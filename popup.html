<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 320px;
    font-family: "Noto Sans JP", "Segoe UI", sans-serif;
    font-size: 13px;
    color: #1a1a1a;
    background: #fafafa;
  }
  header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 14px 16px 10px;
    border-bottom: 1px solid #e5e5e5;
  }
  header h1 {
    font-size: 14px;
    font-weight: 600;
  }
  header .logo {
    width: 22px;
    height: 22px;
    background: #2563eb;
    border-radius: 5px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-weight: 700;
    font-size: 12px;
    flex-shrink: 0;
  }
  .section {
    padding: 12px 16px;
    border-bottom: 1px solid #eee;
  }
  .section:last-child { border-bottom: none; }

  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 32px;
  }
  .row + .row { margin-top: 8px; }

  .label { font-size: 13px; }
  .label small { color: #888; font-size: 11px; display: block; margin-top: 2px; }

  /* Toggle switch */
  .toggle {
    position: relative;
    width: 40px;
    height: 22px;
    flex-shrink: 0;
  }
  .toggle input { opacity: 0; width: 0; height: 0; }
  .toggle .slider {
    position: absolute; inset: 0;
    background: #ccc;
    border-radius: 22px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .toggle .slider::after {
    content: "";
    position: absolute;
    width: 16px; height: 16px;
    left: 3px; top: 3px;
    background: #fff;
    border-radius: 50%;
    transition: transform 0.2s;
  }
  .toggle input:checked + .slider { background: #2563eb; }
  .toggle input:checked + .slider::after { transform: translateX(18px); }

  /* Select */
  select {
    padding: 4px 8px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 12px;
    background: #fff;
    cursor: pointer;
  }

  /* Range slider */
  .range-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 8px;
  }
  .range-row input[type="range"] {
    flex: 1;
    accent-color: #2563eb;
    cursor: pointer;
  }
  .range-value {
    min-width: 40px;
    text-align: right;
    font-size: 12px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    color: #333;
  }
  .range-reset {
    background: none;
    border: 1px solid #ccc;
    border-radius: 4px;
    padding: 2px 6px;
    font-size: 11px;
    color: #666;
    cursor: pointer;
  }
  .range-reset:hover { background: #eee; }
  .weight-preview {
    margin-top: 6px;
    padding: 6px 8px;
    background: #f5f5f5;
    border-radius: 4px;
    font-size: 12px;
    color: #444;
    line-height: 1.5;
  }
  .weight-preview .sample { color: #1a1a1a; }

  /* Site rule */
  .site-badge {
    display: inline-block;
    max-width: 180px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    padding: 2px 8px;
    background: #f0f0f0;
    border-radius: 4px;
    font-size: 12px;
    color: #555;
    font-family: monospace;
  }
  .site-select {
    margin-top: 8px;
  }
  .site-select label { font-size: 12px; color: #666; }
  .site-select select { margin-left: 4px; }

  .state-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .state-copy {
    min-width: 0;
  }
  .state-title {
    font-size: 13px;
    font-weight: 600;
  }
  .state-detail {
    margin-top: 2px;
    font-size: 11px;
    color: #777;
  }
  .state-pill {
    flex-shrink: 0;
    padding: 3px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: #fff;
    background: #9ca3af;
  }
  .state-pill.state-on {
    background: #2563eb;
  }
  .state-pill.state-off {
    background: #6b7280;
  }

  /* Disabled state */
  .controls-disabled {
    opacity: 0.45;
    pointer-events: none;
  }

  .footer {
    padding: 8px 16px;
    text-align: center;
    font-size: 11px;
    color: #aaa;
  }
</style>
</head>
<body>

<header>
  <div class="logo">F</div>
  <h1>Font Override JP</h1>
</header>

<div class="section">
  <div class="state-card">
    <div class="state-copy">
      <div class="state-title">このサイトでの状態</div>
      <div class="state-detail" id="effectiveStateDetail">判定中</div>
    </div>
    <div class="state-pill state-off" id="effectiveStatePill">OFF</div>
  </div>
</div>

<div class="section">
  <div class="row">
    <div class="label">
      グローバル既定
      <small>ONで全サイトに適用</small>
    </div>
    <label class="toggle">
      <input type="checkbox" id="globalToggle">
      <span class="slider"></span>
    </label>
  </div>
  <div class="row">
    <div class="label">モード</div>
    <select id="modeSelect">
      <option value="smart">Smart（対象フォントのみ）</option>
      <option value="force">Force（全フォント上書き）</option>
    </select>
  </div>
</div>

<div class="section">
  <div class="row">
    <div class="label">
      ウェイト補正
      <small>フォントの太さを相対的に調整</small>
    </div>
  </div>
  <div class="range-row">
    <input type="range" id="weightSlider" min="-300" max="300" step="50" value="0">
    <span class="range-value" id="weightValue">±0</span>
    <button class="range-reset" id="weightReset">戻す</button>
  </div>
  <div class="weight-preview">
    <span class="sample" id="previewNormal" style="font-weight:400">通常(400)</span>&ensp;
    <span class="sample" id="previewBold" style="font-weight:700">太字(700)</span>
  </div>
</div>

<div class="section">
  <div class="label" style="margin-bottom:6px;">このサイトの設定</div>
  <div class="site-badge" id="hostname">—</div>
  <div class="site-select">
    <label>
      ルール:
      <select id="siteRule">
        <option value="default">グローバル設定に従う</option>
        <option value="smart">常に有効（Smart）</option>
        <option value="force">常に有効（Force）</option>
        <option value="disabled">無効</option>
      </select>
    </label>
  </div>
</div>

<div class="footer">Reload the page after changing settings</div>

<script src="vendor/tldts.umd.min.js"></script>
<script src="domain.js"></script>
<script src="state.js"></script>
<script src="popup.js"></script>
</body>
</html>
